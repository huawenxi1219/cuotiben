name: Build Flet APK

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'   # 使用当前最新稳定版
          channel: 'stable'

      - name: 验证 Flutter
        run: flutter --version

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: 构建 APK（拆分架构）
        run: |
          flet build apk --split-per-abi

      - name: 上传 APK（自动保留1天）
        uses: actions/upload-artifact@v4
        with:
          name: flet-apk-${{ github.run_number }}
          path: build/apk/*.apk
          retention-days: 1
