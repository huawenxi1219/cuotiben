name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build-android:
    runs-on: ubuntu-24.04   # 固定镜像：ubuntu-26.04 新镜像会让 flet 0.28.3 打包静默失败
    permissions:
      contents: write
    env:
      FLET_CACHE_DIR: ${{ github.workspace }}/.fletcache
      GRADLE_OPTS: >-
        -Dorg.gradle.internal.http.socketTimeout=180000
        -Dorg.gradle.internal.http.connectionTimeout=180000
        -Dorg.gradle.daemon=false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install flet==0.28.3 requests

      - name: 检查 Secrets
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then echo "❌ KEYSTORE_BASE64 为空！"; exit 1; fi
          if [ -z "${{ secrets.ALIAS }}" ]; then echo "❌ ALIAS 为空！"; exit 1; fi
          if [ -z "${{ secrets.ALIAS_PASSWORD }}" ]; then echo "❌ ALIAS_PASSWORD 为空！"; exit 1; fi
          if [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ]; then echo "❌ KEYSTORE_PASSWORD 为空！"; exit 1; fi
          echo "✅ 4 个 Secrets 都有值"

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-release-key.keystore
          echo "📦 keystore 文件大小："
          ls -la my-release-key.keystore
          echo "🔑 keystore 自检（记住这个 SHA-256）："
          keytool -list -keystore my-release-key.keystore -storepass "${{ secrets.KEYSTORE_PASSWORD }}" 2>&1 || true

      - name: 预置 CPython 运行时（绕过 release CDN 504）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DIR="$FLET_CACHE_DIR/python-build-standalone/20250205"
          FILE="cpython-3.12.9+20250205-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz"
          ASSET_ID=226610613
          mkdir -p "$DIR"
          ok=0
          for i in 1 2 3 4 5; do
            echo "===== 第 $i 次尝试下载 CPython ====="

            # 方式一：API 资产接口（带 token，绕过 releases/download 的 504）
            if curl -fL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 600 \
                 -H "Authorization: Bearer $GH_TOKEN" \
                 -H "Accept: application/octet-stream" \
                 -o "$DIR/$FILE.part" \
                 "https://api.github.com/repos/astral-sh/python-build-standalone/releases/assets/$ASSET_ID" \
               && tar tzf "$DIR/$FILE.part" > /dev/null 2>&1; then
              mv "$DIR/$FILE.part" "$DIR/$FILE"
              echo "✅ 通过 API 资产接口获取成功：$(stat -c%s "$DIR/$FILE") bytes"
              ok=1; break
            fi
            rm -f "$DIR/$FILE.part"

            # 方式二：官方 release 直链（CDN 恢复时可用）
            if curl -fL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 600 \
                 -o "$DIR/$FILE.part" \
                 "https://github.com/astral-sh/python-build-standalone/releases/download/20250205/$FILE" \
               && tar tzf "$DIR/$FILE.part" > /dev/null 2>&1; then
              mv "$DIR/$FILE.part" "$DIR/$FILE"
              echo "✅ 通过 release 直链获取成功：$(stat -c%s "$DIR/$FILE") bytes"
              ok=1; break
            fi
            rm -f "$DIR/$FILE.part"
            sleep 10
          done
          if [ "$ok" != "1" ]; then echo "❌ 无法获取完整 CPython 包"; exit 1; fi
          ls -la "$DIR"

      - name: 打包 APK（用命令行参数传签名）
        run: |
          set -uo pipefail
          df -h /home/runner
          ok=0
          for attempt in 1 2 3; do
            echo "===== 第 $attempt 次打包 ====="
            rm -rf build
            if flet build apk \
              --build-number ${{ github.run_number }} \
              --build-version 1.0.${{ github.run_number }} \
              --android-signing-key-store "${{ github.workspace }}/my-release-key.keystore" \
              --android-signing-key-alias "${{ secrets.ALIAS }}" \
              --android-signing-key-password "${{ secrets.ALIAS_PASSWORD }}" \
              --android-signing-key-store-password "${{ secrets.KEYSTORE_PASSWORD }}"; then
              ok=1
              echo "✅ 第 $attempt 次打包成功"
              break
            fi
            echo "⚠️ 第 $attempt 次失败，30s 后重试"
            sleep 30
          done
          echo "=== 产物检查 ==="
          APK=$(find build -name '*.apk' -type f | head -1 || true)
          if [ -z "$APK" ]; then echo "❌ 没有生成任何 APK（ok=$ok）"; exit 1; fi
          echo "✅ 生成: $APK ($(stat -c%s "$APK") bytes)"
          mkdir -p build/apk
          cp "$APK" build/apk/
          ls -la build/apk/

      - name: 检查 APK 签名指纹（关键！）
        run: |
          APK=$(find build/apk -name "*.apk" | head -1)
          echo "📱 APK: $APK"
          echo "🔍 下面这个 SHA256 必须和上面 keystore 的 SHA256 一模一样："
          keytool -printcert -jarfile "$APK" 2>&1 | head -20 || true

      - name: 创建 Tag
        id: tag
        run: |
          TAG="build-$(date +'%Y%m%d-%H%M%S')"
          git tag $TAG
          git push origin $TAG
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          files: build/apk/*.apk
          generate_release_notes: false