name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install flet==0.28.3 requests

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-release-key.keystore

      - name: 打包 APK（正式签名）
        env:
          FLET_ANDROID_SIGNING_KEY_STORE: ${{ github.workspace }}/my-release-key.keystore
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ALIAS }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ALIAS_PASSWORD }}
          FLET_ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          flet build apk \
            --project "池鱼Study" \
            --build-number ${{ github.run_number }} \
            --build-version 1.0.${{ github.run_number }}

      - name: 创建 Tag
        id: tag
        run: |
          TAG="build-$(date +'%Y%m%d-%H%M%S')"
          git tag $TAG
          git push origin $TAG
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          files: build/apk/*.apk
          generate_release_notes: false