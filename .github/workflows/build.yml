name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ master ]
jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet requests

      - name: Clean previous builds
        run: |
          rm -rf build/
          rm -rf __pycache__/

      # ===== 关键：显式复制 android 目录到工作区 =====
      - name: Copy AndroidManifest
        run: |
          if [ -d "android" ]; then
            cp -r android/ ./android_copy
            ls -la android_copy/
          else
            echo "android directory not found"
            exit 1
          fi

      - name: Build APK
        run: |
          echo "y" | flet build apk

      # ===== 将复制的 android 合并到 build 输出（如果 flet 没有自动包含） =====
      - name: Merge AndroidManifest
        run: |
          # 查找 build 目录下的中间产物位置（通常是 build/apk/ 或 build/flutter/）
          # 直接复制到 build/apk/debug/ 目录，让打包工具识别
          if [ -d "android_copy" ]; then
            cp -r android_copy/* build/apk/debug/ 2>/dev/null || true
            cp -r android_copy/* build/apk/ 2>/dev/null || true
            cp -r android_copy/* build/ 2>/dev/null || true
          fi
          # 检查最终 APK 是否包含 AndroidManifest.xml
          find build/ -name "AndroidManifest.xml" || echo "Not found"

      - name: List generated APK
        run: |
          find build/ -name "*.apk" -type f

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: build/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
