name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ master ]
jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet requests

      - name: Clean previous builds
        run: |
          rm -rf build/
          rm -rf __pycache__/

      # ===== 核心修改：强制复制 android 到 build 目录 =====
      - name: Copy AndroidManifest into build
        run: |
          if [ -d "android" ]; then
            mkdir -p build/apk/debug/
            cp -r android/* build/apk/debug/
            cp -r android/* build/apk/
            cp -r android/* build/
            echo "AndroidManifest copied to build directories."
            find build/ -name "AndroidManifest.xml"
          else
            echo "android directory not found! Exiting."
            exit 1
          fi

      - name: Build APK
        run: |
          echo "y" | flet build apk

      # ===== 再次确认 AndroidManifest.xml 是否在最终输出中 =====
      - name: Verify AndroidManifest in build
        run: |
          echo "Searching for AndroidManifest.xml in build folder:"
          find build/ -name "AndroidManifest.xml" || echo "NOT FOUND"

      - name: List generated APK
        run: |
          find build/ -name "*.apk" -type f

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: build/apk/debug/*.apk   # 只上传 debug 版本，避免 404
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
