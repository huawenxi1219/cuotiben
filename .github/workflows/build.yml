name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ master ]
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies (force reinstall)
        run: |
          python -m pip install --upgrade pip
          pip install --force-reinstall --no-cache-dir flet==0.28.0 requests
      - name: Build APK with Flet
        run: |
          flet build apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/**/*.apk
