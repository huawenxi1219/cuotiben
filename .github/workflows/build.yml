name: Build Flet APK

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: 构建 APK
        run: |
          yes | flet build apk --split-per-abi

      - name: 创建 Tag
        id: tag
        run: |
          TAG="build-$(date +'%Y%m%d-%H%M%S')"
          git tag $TAG
          git push origin $TAG
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          files: build/apk/*.apk
          # 如果你想去掉黄色标签，删除下面这行
          prerelease: true