name: Build Flet APK

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: 构建 APK
        run: |
          yes | flet build apk

      - name: 上传 APK 作为 Artifacts（即使 Release 失败也能下载）
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/apk/*.apk

      - name: 创建 Tag
        id: tag
        run: |
          TAG="build-$(date +'%Y%m%d-%H%M%S')"
          git tag $TAG
          git push origin $TAG
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT

      - name: 发布到 Release（正式版）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          files: build/apk/*.apk
          generate_release_notes: false
        continue-on-error: true   # 即使 Release 失败也不影响整体状态