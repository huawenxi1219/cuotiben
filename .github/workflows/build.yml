name: Build Flet APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install flet
          # 如果有 requirements.txt 取消注释下一行
          # pip install -r requirements.txt

      - name: 构建 APK（拆分架构，减小体积）
        run: |
          flet build apk --split-per-abi

      - name: 删除旧的 artifacts（保留最近3次构建）
        uses: actions/delete-artifact@v3
        with:
          name: flet-apk-*   # 匹配前缀，删除所有旧版本的 artifacts
          token: ${{ secrets.GITHUB_TOKEN }}
          failOnError: false

      - name: 上传新的 APK（只保留1天）
        uses: actions/upload-artifact@v4
        with:
          name: flet-apk-${{ github.run_number }}  # 每次构建生成唯一名称
          path: build/apk/*.apk
          retention-days: 1   # 只保留1天，自动删除

      - name: 清理工作目录（可选，节省空间）
        run: |
          rm -rf build/apk/*.apk
