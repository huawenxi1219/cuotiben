name: Build Flet APK

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: 构建 APK（自动回答所有交互）
        run: |
          yes | flet build apk --split-per-abi

      - name: 上传 APK（自动保留1天）
        uses: actions/upload-artifact@v4
        with:
          name: flet-apk-${{ github.run_number }}
          path: build/apk/*.apk
          retention-days: 1
